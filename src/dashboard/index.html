<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Messenger Human Firewall Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --primary: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-title {
      font-size: 13px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .card-value {
      font-size: 20px;
      font-weight: 700;
    }
    .btn {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      border: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 12px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th {
      background: #0f172a;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-scam { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge-normal { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge-sales { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-paused { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ Messenger Human Firewall</h1>
    <div>
      <button id="killswitchBtn" class="btn btn-danger" onclick="toggleKillSwitch()">🛑 PAUSE SYSTEM</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">System Status</div>
      <div id="statusVal" class="card-value">...</div>
    </div>
    <div class="card">
      <div class="card-title">Execution Mode</div>
      <div id="modeVal" class="card-value">...</div>
    </div>
    <div class="card">
      <div class="card-title">Reply Target</div>
      <div id="threadTargetVal" class="card-value" style="font-size: 16px; word-break: break-all;">...</div>
    </div>
    <div class="card">
      <div class="card-title">Active Monitored Threads</div>
      <div id="threadCountVal" class="card-value">0</div>
    </div>
  </div>

  <h2>Monitored Threads</h2>
  <table>
    <thead>
      <tr>
        <th>Thread Hash</th>
        <th>Category / Action</th>
        <th>Risk</th>
        <th>Messages (In / Out)</th>
        <th>Status</th>
        <th>Last Seen</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="threadsTableBody">
      <tr><td colspan="7" style="text-align: center; color: var(--text-dim);">Loading threads...</td></tr>
    </tbody>
  </table>

  <script>
    let currentPaused = false;

    async function fetchStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      currentPaused = data.paused;
      
      const statusEl = document.getElementById('statusVal');
      const btn = document.getElementById('killswitchBtn');
      if (data.paused) {
        statusEl.innerHTML = '<span style="color: var(--danger)">🛑 PAUSED (Kill Switch)</span>';
        btn.textContent = '▶️ RESUME SYSTEM';
        btn.className = 'btn btn-success';
      } else {
        statusEl.innerHTML = '<span style="color: var(--success)">🟢 ACTIVE & RUNNING</span>';
        btn.textContent = '🛑 PAUSE ALL (Kill Switch)';
        btn.className = 'btn btn-danger';
      }

      document.getElementById('modeVal').textContent = `${data.dryRun ? 'DRY_RUN (Console only)' : 'LIVE'} / ${data.autoReplyScope}`;
      document.getElementById('threadTargetVal').textContent = data.autoReplyScope === 'all_threads'
        ? 'Allowlist bypass (composer still required)'
        : (data.allowedTestThreadId || 'None (All live sends blocked)');
    }

    async function toggleKillSwitch() {
      await fetch('/api/killswitch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paused: !currentPaused }),
      });
      await fetchStatus();
    }

    async function toggleThreadPause(threadId, targetPause) {
      await fetch('/api/threads/pause', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ threadId, paused: targetPause }),
      });
      await loadThreads();
    }

    async function loadThreads() {
      const res = await fetch('/api/threads');
      const threads = await res.json();
      document.getElementById('threadCountVal').textContent = threads.length;

      const tbody = document.getElementById('threadsTableBody');
      if (threads.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-dim);">No intercepted threads found in SQLite.</td></tr>';
        return;
      }

      tbody.innerHTML = threads.map(t => {
        const badgeClass = t.mode.includes('TIME_WASTER') ? 'badge-scam' : (t.mode.includes('POLITE') ? 'badge-normal' : 'badge-sales');
        const lastSeenDate = new Date(t.lastSeen).toLocaleTimeString();
        return `
          <tr>
            <td style="font-family: monospace;">` + t.threadId.slice(0, 12) + `...</td>
            <td><span class="badge ` + badgeClass + `">` + t.mode + `</span></td>
            <td><strong>` + t.riskScore + `</strong> / 100</td>
            <td>📥 ` + t.messageCount + ` / 📤 ` + (t.replyCount || 0) + `</td>
            <td>` + (t.paused ? '<span class="badge badge-paused">PAUSED</span>' : '<span class="badge badge-normal">ACTIVE</span>') + `</td>
            <td>` + lastSeenDate + `</td>
            <td>
              <button class="btn btn-sm ` + (t.paused ? 'btn-success' : 'btn-danger') + `" onclick="toggleThreadPause('` + t.threadId + `', ` + !t.paused + `)">
                ` + (t.paused ? 'Resume' : 'Pause') + `
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function refresh() {
      await Promise.all([fetchStatus(), loadThreads()]);
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
